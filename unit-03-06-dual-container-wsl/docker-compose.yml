services:
  backend:
    build:
      context: ./backend
    container_name: lp_demo_backend
    restart: unless-stopped
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
    container_name: lp_demo_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-8088}:80"
